{% extends "base.html" %}
{% block title %}Alert settings{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <div class="icon-circle ic-blue"><i class="bi bi-bell-fill"></i></div>
  <div>
    <h1 class="h3 mb-0">Alert settings</h1>
    <p class="text-muted mb-0">Choose how long you can be quiet before your support circle is told.</p>
  </div>
</div>
<div class="card form-card"><div class="card-body p-4">
  <form method="post" novalidate autocomplete="off">
    {% csrf_token %}
    {% include "partials/form.html" %}
    <button class="btn btn-primary">Save</button>
  </form>
</div></div>
{% endblock %}
