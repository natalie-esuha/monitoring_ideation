{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 420px;">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Welcome back</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors.0 }}</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Email</label>
        <input type="email" name="username" id="{{ form.username.id_for_label }}"
               class="form-control" value="{{ form.username.value|default:'' }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
        <input type="password" name="password" id="{{ form.password.id_for_label }}"
               class="form-control" required>
      </div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="text-center small mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
    <hr>
    <p class="small text-muted mb-0">In crisis? Befrienders Kenya: +254 722 178 177</p>
  </div>
</div>
{% endblock %}
