{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Create your account</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="row">
        {% for field in form %}
          <div class="mb-3 {% if field.name == 'first_name' or field.name == 'last_name' %}col-md-6{% else %}col-12{% endif %}">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
              <div class="text-danger small">{{ error }}</div>
            {% endfor %}
          </div>
        {% endfor %}
      </div>
      <button class="btn btn-primary w-100">Sign up</button>
    </form>
    <p class="text-center small mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a></p>
  </div>
</div>
<script>
  document.querySelectorAll("input, select").forEach(function (el) {
    if (el.type !== "checkbox") el.classList.add(el.tagName === "SELECT" ? "form-select" : "form-control");
  });
</script>
{% endblock %}
